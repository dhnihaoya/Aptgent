[provider.openai]
base_url = "https://open.bigmodel.cn/api/paas/v4"
model = "glm-5.1"
# Set your API key in aptgent.local.toml (project root) or via GLM_API_KEY env var.
api_key_env = "GLM_API_KEY"
temperature = 1
max_tokens = 65536
# Hard cap on reasoning/thinking text (chars). Reasoning beyond this is silently
# dropped while the stream continues so the JSON result is still collected.
max_reasoning_tokens = 16384
