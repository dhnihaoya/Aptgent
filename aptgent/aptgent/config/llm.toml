[provider.openai]
base_url = "https://open.bigmodel.cn/api/paas/v4"
model = "glm-5.1"
fast_model = "glm-5.1"
# Fallback API key (used when GLM_API_KEY env var is not set).
api_key = "465afa7b084140fb814ea657b37805fe.9MLoVE4fJBkl1PUr"
api_key_env = "GLM_API_KEY"
temperature = 1
max_tokens = 65536
# Hard cap on reasoning/thinking text (chars). Reasoning beyond this is silently
# dropped while the stream continues so the JSON result is still collected.
max_reasoning_tokens = 16384
