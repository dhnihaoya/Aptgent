[rna_fold]
command = "/home/dh/.conda/envs/aptgent-tools/bin/RNAfold"
args = ["--noPS", "-d2", "--paramFile=/home/dh/.conda/envs/aptgent-tools/share/ViennaRNA/dna_mathews2004.par"]

[docking]
engine = "vina"
command = "/home/dh/.conda/envs/aptgent-tools/bin/vina"
exhaustiveness = 8
num_modes = 9
energy_range = 3.0

[predictor]
model_dir = "/home/dh/Aptgent/aptgent/aptgent/resources/predictor_models"
conda_env = "aptamer-predictor"
conda_python = "/home/dh/.conda/envs/aptamer-predictor/bin/python"

[pdb_analysis]
# `wget` is preferred when available, but the adapter falls back to `urllib`
# so the server can still run without this binary.
command = "wget"
base_url = "https://files.rcsb.org/download"
