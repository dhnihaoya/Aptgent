[rna_fold]
command = "${APTGENT_RNAFOLD:-RNAfold}"
args = [
    "--noPS",
    "-d2",
    "--paramFile=${APTGENT_RNAFOLD_PARAMS:-dna_mathews2004.par}",
]

[docking]
command = "${APTGENT_VINA:-vina}"
exhaustiveness = 8
num_modes = 9
energy_range = 3.0

[predictor]
# model_dir defaults to the bundled predictor models inside the package.
# Override with APTGENT_MODEL_DIR if using external models.
# When empty (default), the doctor/predictor falls back to the bundled path.
model_dir = "${APTGENT_MODEL_DIR:-}"
# conda_env / conda_python are only needed when the predictor runs in
# a separate conda environment.  In the default single-env setup they
# should remain empty so the current Python is used directly.
conda_env = "${APTGENT_CONDA_ENV:-}"
conda_python = "${APTGENT_CONDA_PYTHON:-}"

[pdb_analysis]
# `wget` is preferred when available, but the adapter falls back to `urllib`
# so the server can still run without this binary.
command = "wget"
base_url = "https://files.rcsb.org/download"

[receptor_prep]
# Open Babel CLI used as the headless equivalent of ADT's
# Edit -> Hydrogens -> Add.
obabel = "${APTGENT_OBABEL:-obabel}"
# Padding (Angstroms) added to every axis of the aptamer-covering search box.
padding_angstrom = 4.0

[rnacomposer]
# RNAComposer auto-mode for generating per-candidate 3D structures.
# Leave defaults to use the public server; override with APTGENT_RNACOMPOSER_URL
# to point at a mirror or local relay.
base_url = "${APTGENT_RNACOMPOSER_URL:-https://rnacomposer.cs.put.poznan.pl}"
timeout_seconds = 60
max_poll_seconds = 1800
poll_interval_seconds = 15
