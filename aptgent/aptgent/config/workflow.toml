[enumeration]
top_k_keep = 500
sub_batch_size = 65536
progress_every = 10000
mutation_batch_timeout_seconds = 0  # 0 means no timeout; run until done or cancelled

[docking]
# When false, docking_selection step skips and _run_docking returns immediately.
enabled = true
per_ligand_timeout_seconds = 1800
# seed: uncomment to set a fixed Vina random seed for reproducibility.
# seed = 42

[paths]
runs_dir = "${APTGENT_RUNS_DIR:-./runs}"
