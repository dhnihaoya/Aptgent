[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aptgent"
version = "0.1.0"
description = "Aptamer design assistant with TUI workflow"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.50",
    "pydantic>=2.0",
    "httpx>=0.25",
    "tomli>=2.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "meeko>=0.5.0",
]

[project.scripts]
aptgent = "aptgent.tui.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["aptgent*"]
