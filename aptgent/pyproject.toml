[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aptgent"
version = "0.1.0"
description = "Aptamer design assistant with TUI workflow"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50",
    "pydantic>=2.0",
    "httpx>=0.25",
    "tomli>=2.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "biopython>=1.83",
    "meeko>=0.5.0",
]

[project.scripts]
aptgent = "aptgent.tui.app:run"

[project.optional-dependencies]
predictor = [
    "torch>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "scipy>=1.12",
    "pandas>=2.1",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["aptgent*"]

[tool.setuptools.package-data]
aptgent = [
    "resources/predictor_models/*.pkl",
    "resources/scripts/*.svl",
    "config/*.toml",
    "config/*.csv",
    "llm/skills/**/*.md",
]
