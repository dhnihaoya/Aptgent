name: aptgent
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  # ── external tools ──────────────────────────────────────
  - viennarna>=2.6
  - autodock-vina>=1.1.2
  # ── scientific stack (predictor runtime) ────────────────
  - rdkit>=2024.03
  - scikit-learn>=1.4
  - xgboost>=2.0
  - numpy>=1.24
  - scipy>=1.12
  - pandas>=2.1
  # ── pip-only packages ───────────────────────────────────
  - pip
  - pip:
      - torch>=2.1
      - meeko>=0.5
      - biopython>=1.83
      - textual>=0.50
      - pydantic>=2.0
      - httpx>=0.25
      - tomli>=2.0
      - psutil>=5.9
      - -e .
