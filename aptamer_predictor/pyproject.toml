[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aptamer-predictor"
version = "0.1.0"
description = "CLI package for aptamer-small molecule interaction prediction"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "rdkit>=2023.3.1",
    "scikit-learn>=1.3.0",
    "torch>=1.12.0",
    "xgboost>=2.0.0",
]

[project.scripts]
aptamer-predictor = "aptamer_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aptamer_predictor*"]
